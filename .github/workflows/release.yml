name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Cafeinate.dmg --title "$GITHUB_REF_NAME" --generate-notes
